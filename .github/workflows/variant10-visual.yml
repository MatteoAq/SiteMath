name: Variant 10 visual evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/variant10-visual.yml'
      - 'tests/variant10-visual.mjs'
jobs:
  frames-variant10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start local SiteMath
        run: |
          python3 -m http.server 4173 >/tmp/sitemath-http.log 2>&1 &
          echo $! >/tmp/sitemath-http.pid
      - name: Capture every variant 01 stage
        run: node tests/variant10-visual.mjs
      - name: Save screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant10-step-screenshots
          path: variant10-screens/
          if-no-files-found: ignore
