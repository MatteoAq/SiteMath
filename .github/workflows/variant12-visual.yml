name: Variant 12 Visual Audit (one-off)
on:
  push:
    paths:
      - '.github/workflows/variant12-visual.yml'
      - 'tests/variant12-visual.mjs'
jobs:
  variant-12-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start SiteMath
        run: |
          python3 -m http.server 4173 >/tmp/variant12.log 2>&1 &
      - name: Capture all 12/1–12/6 steps
        run: node tests/variant12-visual.mjs
      - name: Keep variant 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant12-all-six-tasks
          path: variant12-screens/
          if-no-files-found: warn
