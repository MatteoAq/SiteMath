name: Browser interaction tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static site
        run: |
          python3 -m http.server 8000 >/tmp/sitemath-http.log 2>&1 &
          sleep 2
      - name: Test desktop and mobile interactions
        run: node browser-tests.mjs
