name: Remaining task 4 visual evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-remaining-visual.yml'
      - 'tests/task4-remaining-visual.mjs'
jobs:
  task4-all-other-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start local SiteMath
        run: |
          python3 -m http.server 4173 >/tmp/sitemath-http.log 2>&1 &
          echo $! >/tmp/sitemath-http.pid
      - name: Capture every other variant task 4 stage
        run: node tests/task4-remaining-visual.mjs
      - name: Save screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nineteen-task4-step-screenshots
          path: task4-remaining-screens/
          if-no-files-found: ignore
