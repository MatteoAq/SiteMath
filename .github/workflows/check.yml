name: Check site
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check multi.js
      - run: node scripts/build-variants.mjs --check
      - run: node --check variants.js
      - run: npm install jsdom@26 --no-save
      - run: node tests/paper-originals.mjs
      - run: node tests/task5-geometric-invariants.mjs
      - run: node tests/task4-task6-spatial-invariants.mjs
      - run: node tests/task4-paper-order-audit.mjs
      - run: node tests/line-label-placement.mjs
      - run: node tests/task456-step-provenance.mjs
      - run: node tests/variant01-full-audit.mjs
      - run: node tests/variant02-full-audit.mjs
      - run: node tests/variant03-full-audit.mjs
      - run: node tests/variant04-full-audit.mjs
      - run: node tests/variant05-full-audit.mjs
      - run: node tests/variant06-full-audit.mjs
      - run: node tests/variant07-full-audit.mjs
      - run: node tests/variant08-full-audit.mjs
      - run: node tests/variant09-full-audit.mjs
      - run: node tests/variant10-full-audit.mjs
      - run: node tests/variant11-full-audit.mjs
      - run: node tests/variant13-full-audit.mjs
      - run: node tests/variant14-full-audit.mjs
      - run: node tests/variant15-full-audit.mjs
      - run: node tests/variant16-full-audit.mjs
      - run: node tests/variant17-full-audit.mjs
      - run: node tests/variant18-full-audit.mjs
      - run: node tests/variant19-full-audit.mjs
      - run: node tests/variant20-full-audit.mjs
      - run: node tests/text-audit.mjs
      - run: node tests/runtime.mjs
      - run: node tests/informativeness-audit.mjs
      - run: node tests/variant12-full-audit.mjs
      - run: node tests/remote-source-conditioning.mjs
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics
          path: |
            runtime-results.json
            text-audit.json
            informativeness-report.json
          if-no-files-found: ignore

  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive reproducible site sources
        uses: actions/upload-artifact@v4
        with:
          name: sitemath-ui-source
          path: |
            index.html
            styles.css
            multi.js
            variants.js
            data/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/sitemath-http.log 2>&1 &
          echo $! > /tmp/sitemath-http.pid
      - name: Capture every step of variant 13 and audit rendered annotations
        run: node tests/variant13-visual.mjs
      - name: Upload sequential variant 13 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant13-sequential-visual-evidence
          path: variant13-screens/
          if-no-files-found: error
      - name: Capture every step of variant 12 and audit rendered annotations
        run: node tests/variant12-visual.mjs
      - name: Upload sequential variant 12 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant12-sequential-visual-evidence
          path: variant12-screens/
          if-no-files-found: error
      - name: Capture every step of variant 11 and audit rendered annotations
        run: node tests/variant11-visual.mjs
      - name: Upload sequential variant 11 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant11-sequential-visual-evidence
          path: variant11-screens/
          if-no-files-found: error
      - name: Capture every step of variant 10 and audit rendered annotations
        run: node tests/variant10-visual.mjs
      - name: Upload sequential variant 10 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant10-sequential-visual-evidence
          path: variant10-screens/
          if-no-files-found: error
      - name: Capture every step of variant 09 and audit rendered annotations
        run: node tests/variant09-visual.mjs
      - name: Upload sequential variant 09 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant09-sequential-visual-evidence
          path: variant09-screens/
          if-no-files-found: error
      - name: Capture every step of variant 08 and audit rendered annotations
        run: node tests/variant08-visual.mjs
      - name: Upload sequential variant 08 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant08-sequential-visual-evidence
          path: variant08-screens/
          if-no-files-found: error
      - name: Capture every step of variant 07 and audit rendered annotations
        run: node tests/variant07-visual.mjs
      - name: Upload sequential variant 07 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant07-sequential-visual-evidence
          path: variant07-screens/
          if-no-files-found: error
      - name: Capture every step of variant 01 and audit rendered annotations
        run: node tests/variant01-visual.mjs
      - name: Upload sequential variant 01 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant01-sequential-visual-evidence
          path: variant01-screens/
          if-no-files-found: error
      - name: Capture every step of variant 02 and audit rendered annotations
        run: node tests/variant02-visual.mjs
      - name: Upload sequential variant 02 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant02-sequential-visual-evidence
          path: variant02-screens/
          if-no-files-found: error
      - name: Capture every step of variant 03 and audit rendered annotations
        run: node tests/variant03-visual.mjs
      - name: Upload sequential variant 03 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant03-sequential-visual-evidence
          path: variant03-screens/
          if-no-files-found: error
      - name: Capture every step of variant 04 and audit rendered annotations
        run: node tests/variant04-visual.mjs
      - name: Upload sequential variant 04 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant04-sequential-visual-evidence
          path: variant04-screens/
          if-no-files-found: error
      - name: Capture every step of variant 05 and audit rendered annotations
        run: node tests/variant05-visual.mjs
      - name: Upload sequential variant 05 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant05-sequential-visual-evidence
          path: variant05-screens/
          if-no-files-found: error
      - name: Capture every step of variant 06 and audit rendered annotations
        run: node tests/variant06-visual.mjs
      - name: Upload sequential variant 06 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant06-sequential-visual-evidence
          path: variant06-screens/
          if-no-files-found: error
      - name: Verify dark theme, A4 paper, Telegram and drag
        run: node tests/theme-interactions.mjs
      - name: Audit dark controls and responsive button placement
        run: node tests/dark-ui-audit.mjs
      - name: Upload dark interface inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-ui-inspection
          path: |
            dark-ui-audit.json
            dark-ui-screenshots/
          if-no-files-found: ignore
      - name: Upload dark theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots
          path: theme-screenshots/
          if-no-files-found: ignore
      - name: Run mobile browser layout checks
        run: node tests/mobile-layout.mjs
      - name: Check mouse wheel and reconstructed variants
        run: node tests/wheel-zoom.mjs
      - name: Verify line conventions from the teaching materials
        run: node tests/line-conventions.mjs
      - name: Verify course projection and right-triangle methods
        run: node tests/lecture-projections.mjs
      - name: Check multi-assignment catalogue and mobile navigation
        run: node tests/assignment-catalog.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-artifacts
          path: |
            mobile-layout-results.json
            mobile-screenshots/
          if-no-files-found: ignore

  visual-remaining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/sitemath-rest-http.log 2>&1 &
          echo $! > /tmp/sitemath-rest-http.pid
      - name: Audit remaining variants in strict order
        run: |
          set +e
          failed=0
          for n in 14 15 16 17 18 19 20; do
            echo "AUDIT VARIANT $n"
            node tests/variant${n}-visual.mjs
            if [ $? -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload sequential evidence for variants 14 to 20
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant14-20-sequential-visual-evidence
          path: |
            variant14-screens/
            variant15-screens/
            variant16-screens/
            variant17-screens/
            variant18-screens/
            variant19-screens/
            variant20-screens/
          if-no-files-found: warn
