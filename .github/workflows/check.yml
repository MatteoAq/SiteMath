name: Check site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check multi.js
      - run: node --check variants.js
      - run: npm install jsdom@26 --no-save
      - run: node tests/runtime.mjs
