name: One-time SiteMath Methodical Evidence
on:
  push:
    paths:
      - '.github/workflows/stepwise-once.yml'
jobs:
  stepwise:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: 01-05
            variants: '01,02,03,04,05'
          - batch: 06-10
            variants: '06,07,08,09,10'
          - batch: 11-15
            variants: '11,12,13,14,15'
          - batch: 16-20
            variants: '16,17,18,19,20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/site-audit.log 2>&1 &
      - name: Capture original, all intermediate and final construction frames
        env:
          STEPWISE_AUDIT: '1'
          STEPWISE_AUDIT_VARIANTS: ${{ matrix.variants }}
        run: node tests/mobile-layout.mjs
      - name: Store all stepwise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methodical-steps-${{ matrix.batch }}
          path: |
            mobile-layout-results.json
            mobile-screenshots/
          if-no-files-found: warn
          compression-level: 5
