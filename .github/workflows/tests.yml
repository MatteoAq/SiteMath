name: Site smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check matrix-core.js
          node --check app.js
          node --check workbook.js
          node --check tests.js
      - name: Matrix and UI structure tests
        run: node tests.js
